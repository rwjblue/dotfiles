#:schema https://mise.jdx.dev/schema/mise.json

# Required to read lockfile revision 4.
min_version = "2026.11.1"

[tools]
# cargo augmenting tools
cargo-binstall = "latest"
cargo-insta = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-edit" = "latest"

# software verification (see https://mise.jdx.dev/tips-and-tricks.html#software-verification)
slsa-verifier = "latest"
cosign = "latest"

# provides completion and parsing support for tasks see:
# https://mise.jdx.dev/tasks/file-tasks.html#arguments
usage = "latest"

# useful global tools
"npm:@mermaid-js/mermaid-cli" = "11"
"go:github.com/spf13/cobra-cli" = "latest"
"claude-code" = "latest"
"opencode" = "1"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:sort-package-json" = "latest"
"npm:ccstatusline" = "latest"
"npm:@mcpjam/inspector" = "2"
"npm:@openai/codex" = "latest"
"npm:@fission-ai/openspec" = "1"
"npm:agent-browser" = "latest"
"aqua:docker/compose" = "latest"
# pinned — run /rtk-evaluate before upgrading
"github:rtk-ai/rtk" = { version = "1.2.0", matching_regex = "^rtk-oss-.*[.](tar[.]gz|zip)$" }

# core tools
go = "1.26"
node = "26"
python = "3.14"
ruby = "latest"
rust = { version = "latest", components = "rust-analyzer,clippy" }
uv = "latest"
zig = "latest"
bun = "latest"
"aqua:aubepkg/aube" = "latest"

[vars]
gh_user = "rwjblue"
# machine_role = "personal" # override in config.local.toml (e.g. "work")

[env]
GH_TOKEN = { value = "{{ exec(command='gh auth token --user ' ~ vars.gh_user, cache_duration='4h') }}", redact = true }

[settings]
experimental = true
lockfile = true
aqua.registries = [".config/mise/aqua-registry.yaml"]
# disabled until https://github.com/jdx/mise/issues/4600 is resolved
#python.uv_venv_auto = true
pipx.uvx = true
