[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
version = "0.1.0"
authors = ["Robert Jackson <me@rwjblue.com>"]

[workspace.dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.31", features = ["derive"] }
tempfile = "3.18.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
latest_bin = { path = "../../../../malleatus/shared_binutils/latest_bin" }
