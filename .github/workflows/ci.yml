name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          scripts=()
          while IFS= read -r -d '' path; do
            if IFS= read -r first_line < "$path" && [[ "$first_line" == '#!'*bash* ]]; then
              scripts+=("$path")
            fi
          done < <(git ls-files -z -- install scripts mise packages/mise/tasks packages/cursor packages/claude/hooks)
          shellcheck --severity=warning --external-sources "${scripts[@]}"

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run skills:check
      - run: mise tasks validate
      - run: mise run dot:test-install

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type-check global mise tasks
        working-directory: packages/mise/tasks
        run: |
          npm ci --ignore-scripts
          npx --no-install tsc --noEmit
      - name: Validate OpenSpec specs
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          version=$(python3 - <<'PY'
          import tomllib

          with open('packages/mise/mise.lock', 'rb') as file:
              lock = tomllib.load(file)
          print(lock['tools']['npm:@fission-ai/openspec'][0]['version'])
          PY
          )
          npm exec --yes --package="@fission-ai/openspec@$version" -- openspec validate --specs

  mise-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify npm lock sidecars
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          lockfile = Path('packages/mise/mise.lock')
          with lockfile.open('rb') as file:
              lock = tomllib.load(file)
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0'))
          missing = []
          for entries in lock['tools'].values():
              for entry in entries:
                  if sidecar := entry.get('aube'):
                      directory = lockfile.parent / sidecar['path']
                      for name in ('package.json', 'aube-lock.yaml'):
                          path = directory / name
                          if path.as_posix() not in tracked or not path.is_file():
                              missing.append(path.as_posix())
          if missing:
              raise SystemExit('Missing tracked mise lock files:\n' + '\n'.join(missing))
          PY

  binutils:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/binutils
    steps:
      - uses: actions/checkout@v4
      # Cargo path dependencies expect shared_binutils as a sibling org checkout.
      - run: git clone --depth 1 https://github.com/malleatus/shared_binutils.git "$GITHUB_WORKSPACE/../../malleatus/shared_binutils"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/binutils
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  agent-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run agent-review:test
